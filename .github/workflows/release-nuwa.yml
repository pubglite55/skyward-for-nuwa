name: Release nuwa

# The fork's own release: a tag beginning nuwa-v builds the nuwa image
# alone and publishes it as a release of its own. Upstream's Build
# workflow keeps releasing every device from a v tag; this one only does
# anything on the fork's own repository.
on:
  push:
    tags: ["nuwa-v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish nuwa
    runs-on: ubuntu-24.04
    if: github.repository == 'pubglite55/skyward-for-nuwa'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service and the packer
        run: |
          # The build is the release it is made for, so that Skyward's own
          # update check compares like with like: a tag nuwa-v1.5 makes a
          # build that says 1.5.
          export SKYWARD_VERSION="${GITHUB_REF_NAME#nuwa-v}"
          cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
          cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
          cargo build --locked --release -p skyward-pack
          mkdir tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/
      - name: Ask which stock build the recovery is made on
        id: stock
        run: tools/skyward-pack stock --config devices/nuwa.toml >> "$GITHUB_OUTPUT"
      - name: Take the recovery partition out of the stock package
        run: tools/skyward-pack stock --config devices/nuwa.toml --out stock/recovery.img
      - name: Check the stock recovery
        env:
          RECOVERY: ${{ steps.stock.outputs.recovery }}
        run: echo "$RECOVERY  stock/recovery.img" | sha256sum --check
      - name: Pack the recovery
        env:
          VERSION: ${{ steps.stock.outputs.version }}
        run: |
          name="skyward-nuwa-${GITHUB_REF_NAME#nuwa-}-$VERSION"
          mkdir out
          tools/skyward-pack recovery --stock stock/recovery.img --binary tools/skyward --system-init tools/system-init --config devices/nuwa.toml \
            --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt --out "out/$name.img"
          (cd out && zip -9 "$name.zip" "$name.img")
          sha256sum "out/$name.zip" | sed 's|out/||' > "out/SHA256SUMS.txt"
          echo "name=$name" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          # Skyward for nuwa · 小米 13 Pro

          基于 kirklin/skyward 0.2.0 的移植版，只服务小米 13 Pro（nuwa），commit ${GITHUB_SHA::7}。
          开机进首页，data 分区按需打开：点「解密」或直接进「文件」时才会去解。

          ## 解密
          - **跨代密钥**：手机跑的系统比 data 新也能开（如 Android 17 / 补丁 2099-12-31 写出的数据），
            恢复时写 \`ro.vendor.build.security_patch\` 等三个属性，解除 keymint 的 -62 KEY_REQUIRES_UPGRADE
          - 任意系统版本的 fstab 都能找到 data 条目（只取前 5 列、容忍多余列、按 \`metadata_encryption\` 选）
          - 明文 data 直接挂载；ext4 / f2fs 都支持
          - 跳过第二空间用户 999；记住锁屏密码，下次开机自动解开（失效即删）

          ## 界面
          - 深色 / 浅色；简体中文、繁体中文、英文
          - **内置浏览器**（高级 → 浏览器）：输入网址，读网页的文字与链接，链接可直接点开；
            恢复里没有安卓运行时，所以不能安装 APK，页面也不会执行脚本
          - 解密页 5 步进度环；文件、安装、备份、清除都带进度与停止
          - 音量键可全程操作；音量下 + 电源 = 截图

          ## 网络
          - WLAN：自动连接（开机即开并连上次的网络）、记住密码（被拒自动丢弃）
          - 无线传输：同一网段浏览器打开 \`http://手机地址:8080/\`，列目录 / 下载（支持续传）/ 拖放上传
          - 网络下载：直链下载、断点续传、停止保留；另一台手机扫二维码（8081）输入网址回填，或读 \`link.txt\`

          ## 其它
          安装 zip / OTA / img、adb sideload、系统更新合并、Skyward 自更新（多镜像测速换源）、
          A/B 槽位、双系统、挂载、清除（含 miuilog 等 8 个日志目录）、文件管理 / 编辑 / 终端、
          SELinux 上下文修复、文件系统修复与格式化、日志导出、MTP、备份（跳过错文件并计数）、恢复

          ## 刷入（前提：BL 已解锁）

          \`\`\`
          adb reboot bootloader
          fastboot flash recovery_a ${name}.img
          fastboot flash recovery_b ${name}.img
          fastboot reboot recovery
          \`\`\`

          也可以直接进 recovery 刷 zip（安装 → 选这个 zip）。刷 recovery 不影响系统与 OTA；
          回官方 recovery 刷回原厂镜像即可。
          NOTES
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" --clobber --repo "$GITHUB_REPOSITORY" "out/$name.zip" "out/SHA256SUMS.txt" \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Skyward for nuwa · Xiaomi 13 Pro" \
              --notes-file notes.md "out/$name.zip#Xiaomi 13 Pro (nuwa)" "out/SHA256SUMS.txt"
