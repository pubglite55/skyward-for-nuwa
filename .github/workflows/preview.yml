name: Preview

# The pages drawn on a computer and kept as pictures: what the phone shows,
# without the phone. Run by hand, from the branch whose pages are to be seen.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draw:
    name: Draw the pages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Draw
        run: cargo run --locked -p skyward-preview -- preview-out
      - name: Draw the storage map
        run: |
          cargo run --locked -p skyward-preview -- preview-out --map
          cargo run --locked -p skyward-preview -- preview-out --map --dark
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview-out
          if-no-files-found: error
